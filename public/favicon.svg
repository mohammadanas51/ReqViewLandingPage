<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#262C38" stroke-width="1.5"/>

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- RV Monogram -->
  <g fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- R letterform -->
    <path d="M 18 44 L 18 20 L 28 20 C 33 20 35 23 35 27 C 35 31 33 34 28 34 L 18 34 M 27 34 L 35 44" />
    
    <!-- V letterform connected subtly -->
    <path d="M 36 24 L 44 44 L 52 24" />
  </g>

  <!-- Spec check dot -->
  <circle cx="48" cy="18" r="3" fill="#38BDF8"/>
</svg>

